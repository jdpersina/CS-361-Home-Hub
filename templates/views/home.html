<section id="view-home" aria-labelledby="home-title">

  <header id="home-header">
    <div id="home-logo" aria-hidden="true"></div>
    <p id="home-brand">THE PERSINA HOME</p>
    <h1 id="home-title">Hello, Persina's.</h1>
  </header>

  <article id="calendar-card">
    <h2 id="calendar-card-heading">On the calendar</h2>
    <p id="today-count"></p>
    <ul id="today-events"></ul>
    <button type="button" id="btn-open-calendar">View family calendar</button>
  </article>

  <article id="date-card">
    <p id="date-month-year"></p>
    <p id="date-day"></p>
    <p id="date-weekday"></p>
  </article>

</section>
